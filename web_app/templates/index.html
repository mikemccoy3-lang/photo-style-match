<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Photo Style Match</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#1c1c1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Style Match">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 2rem) 1.25rem 2.5rem;
      text-align: center;
    }
    #save { width: 100%; margin-top: 1rem; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    p.sub { opacity: 0.7; margin-top: 0; margin-bottom: 2rem; }
    input[type="file"] {
      display: block;
      width: 100%;
      margin: 1.5rem 0;
      padding: 0.9rem;
      border: 1px dashed #888;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .buttons button { min-height: 3.4rem; }
    button {
      font-size: 1.05rem;
      padding: 0.9rem 0.5rem;
      border: none;
      border-radius: 10px;
      background: #1c1c1e;
      color: white;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.5; }
    #status { margin-top: 1.25rem; opacity: 0.75; min-height: 1.2em; font-size: 0.95rem; }
    #preview {
      margin-top: 1.5rem;
      max-width: 100%;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Photo Style Match</h1>
  <p class="sub">Upload a photo, pick a look, get the graded version.</p>

  <form id="grade-form">
    <input type="file" name="photo" id="photo" accept="image/*" required>
    <div class="buttons">
      {% for key, label in styles.items() %}
      <button type="submit" name="style" value="{{ key }}">{{ label }}</button>
      {% endfor %}
    </div>
  </form>
  <div id="status"></div>
  <img id="preview" alt="Graded result">
  <button id="save" type="button" hidden>Save photo</button>

  <script>
    const form = document.getElementById('grade-form');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');
    const buttons = form.querySelectorAll('button');
    const saveBtn = document.getElementById('save');
    let resultUrl = null;
    let resultFile = null;

    // On phones this opens the share sheet ("Save Image" / "Save to Photos"),
    // which is the reliable way to save from an installed home-screen app.
    // Desktop browsers fall back to a normal file download.
    saveBtn.addEventListener('click', async () => {
      if (!resultFile) return;
      if (navigator.canShare && navigator.canShare({ files: [resultFile] })) {
        try {
          await navigator.share({ files: [resultFile] });
        } catch (err) {
          if (err.name !== 'AbortError') status.textContent = 'Could not open share sheet: ' + err.message;
        }
        return;
      }
      const a = document.createElement('a');
      a.href = resultUrl;
      a.download = resultFile.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const submitter = event.submitter;
      const photo = document.getElementById('photo').files[0];
      if (!photo) return;

      buttons.forEach((b) => (b.disabled = true));
      status.textContent = 'Grading…';
      preview.style.display = 'none';
      saveBtn.hidden = true;

      const data = new FormData();
      data.append('photo', photo);
      data.append('style', submitter.value);

      try {
        const res = await fetch('/grade', { method: 'POST', body: data });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || 'Something went wrong.');
        }
        const blob = await res.blob();
        if (resultUrl) URL.revokeObjectURL(resultUrl);
        resultUrl = URL.createObjectURL(blob);
        resultFile = new File([blob], `${submitter.value}_graded.jpg`, { type: 'image/jpeg' });

        preview.src = resultUrl;
        preview.style.display = 'block';
        saveBtn.hidden = false;

        status.textContent = 'Done — tap Save photo.';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        buttons.forEach((b) => (b.disabled = false));
      }
    });
  </script>
</body>
</html>
