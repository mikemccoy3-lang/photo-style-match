# Render's free web services go to sleep after ~15 minutes without traffic, and
# the next visitor waits 30-50 seconds for them to wake. This pings the app
# every 10 minutes so it stays awake. To turn it off, delete this file (or
# disable the workflow in the repo's Actions tab).
#
# Notes:
#  - GitHub runs scheduled workflows on a best-effort basis; an occasional
#    ping can be late.
#  - GitHub pauses scheduled workflows on a repo with no activity for 60 days.
#    Any push, or "Run workflow" in the Actions tab, wakes it again.
#  - One always-on free Render service uses ~744 of the 750 free monthly hours.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://photo-style-match.onrender.com/healthz
